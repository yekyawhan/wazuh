<svg width="400" height="500" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      rect { fill: #f9f9f9; stroke: #333; rx: 5; ry: 5; }
      text { font-family: Arial; font-size: 12px; text-anchor: middle; }
    </style>
  </defs>
  <!-- ရိုးရှင်းသော Workflow Diagram -->
  <rect x="150" y="20" width="100" height="30" />
  <text x="200" y="40">Wazuh Manager</text>
  <line x1="200" y1="50" x2="200" y2="80" stroke="black" marker-end="url(#arrowhead)"/>
  
  <rect x="125" y="80" width="150" height="40" />
  <text x="200" y="105">usb_whitelist.txt</text>
  
  <rect x="150" y="150" width="100" height="30" />
  <text x="200" y="170">Wazuh Agent</text>
  
  <!-- Linux / Win Split -->
  <line x1="200" y1="180" x2="100" y2="220" stroke="black"/>
  <line x1="200" y1="180" x2="300" y2="220" stroke="black"/>
  
  <rect x="50" y="220" width="100" height="30" />
  <text x="100" y="240">Linux V2</text>
  <rect x="250" y="220" width="100" height="30" />
  <text x="300" y="240">Windows V2</text>
</svg>

```GitHub မှာ Diagram ပေါ်လာအောင် Mermaid သုံးတာက အကောင်းဆုံးပဲ။ အဆင်ပြေရဲ့လား?
