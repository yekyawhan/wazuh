<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff" rx="10"/>

  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">USB Blocking Architecture</text>

  <!-- OS Layer -->
  <rect x="50" y="100" width="300" height="150" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" rx="8"/>
  <text x="200" y="140" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0d47a1">OS Layer</text>
  <text x="200" y="170" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333">Windows GPO / Linux udev</text>
  <rect x="100" y="190" width="200" height="40" fill="#c62828" stroke="#b71c1c" stroke-width="1" rx="4"/>
  <text x="200" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">Blocks Unauthorized USB</text>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="12" font-style="italic" text-anchor="middle" fill="#d32f2f">100% Offline Capable</text>

  <!-- Wazuh Agent -->
  <rect x="450" y="100" width="300" height="80" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" rx="8"/>
  <text x="600" y="135" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#e65100">Wazuh Agent</text>
  <text x="600" y="160" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Reads OS Event Logs / syslog</text>

  <!-- Wazuh Manager -->
  <rect x="450" y="250" width="300" height="80" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" rx="8"/>
  <text x="600" y="285" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1b5e20">Wazuh Manager</text>
  <text x="600" y="310" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">Generates Alerts</text>

  <!-- Arrows -->
  <g stroke="#666" stroke-width="3" fill="none">
    <path d="M 350 140 L 440 140"/>
    <path d="M 600 180 L 600 240"/>
  </g>
  <g fill="#666">
    <polygon points="440,135 450,140 440,145"/>
    <polygon points="595,240 600,250 605,240"/>
  </g>
</svg>