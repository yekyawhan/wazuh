<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="950" viewBox="0 0 900 950" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>

    <style>
      .box {
        fill: #ffffff;
        stroke: #333;
        stroke-width: 2;
        rx: 12;
        ry: 12;
      }

      .title {
        font-family: Arial, sans-serif;
        font-size: 24px;
        font-weight: bold;
        fill: #111;
        text-anchor: middle;
      }

      .text {
        font-family: Arial, sans-serif;
        font-size: 20px;
        fill: #222;
        text-anchor: middle;
      }

      .line {
        stroke: #555;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
      }

      .linux {
        fill: #e8f5e9;
        stroke: #2e7d32;
      }

      .windows {
        fill: #e3f2fd;
        stroke: #1565c0;
      }

      .central {
        fill: #fff3e0;
        stroke: #ef6c00;
      }

      .security {
        fill: #fce4ec;
        stroke: #c2185b;
      }
    </style>
  </defs>


  <!-- Title -->
  <text x="450" y="50" class="title">
    Wazuh USB Whitelist Management Workflow
  </text>


  <!-- Wazuh Manager -->
  <rect x="250" y="90" width="400" height="70" class="box"/>
  <text x="450" y="135" class="text">
    Wazuh Manager
  </text>


  <!-- Arrow -->
  <path d="M450 160 L450 210" class="line"/>


  <!-- Central Config -->
  <rect x="200" y="220" width="500" height="90" class="box central"/>
  <text x="450" y="260" class="text">
    usb_whitelist.txt
  </text>
  <text x="450" y="290" class="text">
    (Centralized Config)
  </text>


  <!-- Arrow -->
  <path d="M450 310 L450 360" class="line"/>


  <!-- Agent -->
  <rect x="250" y="370" width="400" height="70" class="box"/>
  <text x="450" y="415" class="text">
    Wazuh Agent
  </text>


  <!-- Split Lines -->
  <path d="M450 440 L450 480" class="line"/>

  <path d="M450 480 L250 540" class="line"/>
  <path d="M450 480 L650 540" class="line"/>


  <!-- Linux -->
  <rect x="100" y="550" width="300" height="80" class="box linux"/>
  <text x="250" y="600" class="text">
    Linux V2
  </text>


  <!-- Windows -->
  <rect x="500" y="550" width="300" height="80" class="box windows"/>
  <text x="650" y="600" class="text">
    Windows V2
  </text>


  <!-- Linux Flow -->
  <path d="M250 630 L250 680" class="line"/>

  <rect x="100" y="690" width="300" height="80" class="box"/>
  <text x="250" y="740" class="text">
    Generate Rules
  </text>


  <path d="M250 770 L250 820" class="line"/>

  <rect x="100" y="830" width="300" height="80" class="box"/>
  <text x="250" y="880" class="text">
    Auto Reload
  </text>



  <!-- Windows Flow -->
  <path d="M650 630 L650 680" class="line"/>

  <rect x="500" y="690" width="300" height="80" class="box"/>
  <text x="650" y="730" class="text">
    Generate Registry
  </text>
  <text x="650" y="755" class="text">
    Policy
  </text>


  <path d="M650 770 L650 820" class="line"/>

  <rect x="500" y="830" width="300" height="80" class="box"/>
  <text x="650" y="880" class="text">
    Auto Apply
  </text>


  <!-- Final Result -->
  <path d="M250 910 L450 940" class="line"/>
  <path d="M650 910 L450 940" class="line"/>

  <rect x="250" y="940" width="400" height="70" class="box security"/>
  <text x="450" y="985" class="text">
    USB Allow / Block
  </text>

</svg>
