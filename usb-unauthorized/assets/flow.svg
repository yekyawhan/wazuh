<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1840" height="1040" xmlns="http://www.w3.org/2000/svg" style="background-color: #0f172a;">
  <style>
    .manager { fill: #1e293b; stroke: #fbbf24; stroke-width: 4; rx: 10; }
    .config { fill: #1e293b; stroke: #f87171; stroke-width: 4; rx: 10; }
    .agent { fill: #1e293b; stroke: #38bdf8; stroke-width: 4; rx: 10; }
    .linux { fill: #1e293b; stroke: #4ade80; stroke-width: 4; rx: 10; }
    .win { fill: #1e293b; stroke: #60a5fa; stroke-width: 4; rx: 10; }
    .action { fill: #1e293b; stroke: #c084fc; stroke-width: 3; rx: 8; }
    .final { fill: #0284c7; stroke: #ffffff; stroke-width: 4; rx: 10; }
    text { font-family: 'Segoe UI', sans-serif; font-size: 26px; fill: #ffffff; text-anchor: middle; }
    line { stroke: #94a3b8; stroke-width: 4; }
    .frame { fill: none; stroke: #475569; stroke-width: 5; stroke-dasharray: 15,15; rx: 25; }
  </style>

  <rect x="30" y="30" width="1780" height="980" class="frame" />

  <!-- Wazuh Manager -->
  <rect x="820" y="80" width="200" height="70" class="manager" />
  <text x="920" y="125">Wazuh Manager</text>
  <line x1="920" y1="150" x2="920" y2="200" />

  <!-- Config -->
  <rect x="720" y="200" width="400" height="80" class="config" />
  <text x="920" y="235">usb_whitelist.txt</text>
  <text x="920" y="260" style="font-size: 20px; fill: #fca5a5;">(Centralized Config)</text>
  <line x1="920" y1="280" x2="920" y2="330" />

  <!-- Agent -->
  <rect x="820" y="330" width="200" height="70" class="agent" />
  <text x="920" y="375">Wazuh Agent</text>
  <line x1="920" y1="400" x2="920" y2="440" />
  <line x1="620" y1="440" x2="1220" y2="440" />

  <!-- Linux/Win -->
  <rect x="520" y="480" width="200" height="70" class="linux" />
  <text x="620" y="525">Linux V2</text>
  <rect x="1120" y="480" width="200" height="70" class="win" />
  <text x="1220" y="525">Windows V2</text>
  
  <line x1="620" y1="550" x2="620" y2="600" />
  <line x1="1220" y1="550" x2="1220" y2="600" />

  <!-- Actions -->
  <rect x="520" y="600" width="200" height="70" class="action" />
  <text x="620" y="645">Generate Rules</text>
  <rect x="1120" y="600" width="280" height="70" class="action" />
  <text x="1260" y="645">Generate Registry Policy</text>

  <line x1="620" y1="670" x2="620" y2="720" />
  <line x1="1260" y1="670" x2="1260" y2="720" />

  <rect x="520" y="720" width="200" height="70" class="action" />
  <text x="620" y="765">Auto Reload</text>
  <rect x="1120" y="720" width="200" height="70" class="action" />
  <text x="1220" y="765">Auto Apply</text>

  <!-- Final -->
  <line x1="620" y1="790" x2="920" y2="850" />
  <line x1="1260" y1="790" x2="920" y2="850" />
  <rect x="820" y="850" width="200" height="70" class="final" />
  <text x="920" y="895" style="font-weight: bold;">USB Allow / Block</text>
</svg>
