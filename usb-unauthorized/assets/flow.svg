<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#ffffff"/>
  
  <!-- Manager Zone -->
  <rect x="50" y="50" width="700" height="120" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2" rx="10" stroke-dasharray="5,5"/>
  <text x="400" y="80" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Wazuh Manager (Central Control)</text>
  <rect x="300" y="100" width="200" height="50" fill="#fff3bf" stroke="#f59f00" stroke-width="2" rx="5"/>
  <text x="400" y="130" font-family="Arial" font-size="14" text-anchor="middle">usb_whitelist.txt</text>

  <!-- Sync Arrow -->
  <path d="M 400 150 L 400 220" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Endpoint Zone -->
  <rect x="50" y="250" width="700" height="150" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2" rx="10"/>
  <text x="400" y="280" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Endpoint (Windows/Linux)</text>
  
  <rect x="100" y="310" width="250" height="60" fill="#a5d8ff" stroke="#339af0" stroke-width="2" rx="5"/>
  <text x="225" y="345" font-family="Arial" font-size="14" text-anchor="middle">OS Blocking (GPO / udev)</text>
  
  <rect x="450" y="310" width="250" height="60" fill="#b2f2bb" stroke="#51cf66" stroke-width="2" rx="5"/>
  <text x="575" y="345" font-family="Arial" font-size="14" text-anchor="middle">Wazuh Agent (Sync & Alert)</text>

  <!-- Definitions -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#495057" />
    </marker>
  </defs>
</svg>
