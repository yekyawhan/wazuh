<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1840" height="700" xmlns="http://www.w3.org/2000/svg" style="background-color: #0f172a;">
  <style>
    .manager { fill: #1e293b; stroke: #fbbf24; stroke-width: 4; rx: 10; }
    .config { fill: #1e293b; stroke: #f87171; stroke-width: 4; rx: 10; }
    .agent { fill: #1e293b; stroke: #38bdf8; stroke-width: 4; rx: 10; }
    .os { fill: #1e293b; stroke: #4ade80; stroke-width: 4; rx: 10; }
    .action { fill: #1e293b; stroke: #c084fc; stroke-width: 3; rx: 8; }
    .final { fill: #0284c7; stroke: #ffffff; stroke-width: 4; rx: 10; }
    text { font-family: 'Segoe UI', sans-serif; font-size: 22px; fill: #ffffff; text-anchor: middle; }
    line { stroke: #94a3b8; stroke-width: 4; }
    .frame { fill: none; stroke: #475569; stroke-width: 5; stroke-dasharray: 15,15; rx: 25; }
  </style>

  <rect x="30" y="30" width="1780" height="640" class="frame" />

  <!-- Flow: Manager -> Config -> Agent -> OS -> Actions -> Final -->
  <rect x="50" y="300" width="180" height="60" class="manager" />
  <text x="140" y="340">Wazuh Manager</text>
  <line x1="230" y1="330" x2="280" y2="330" />

  <rect x="280" y="290" width="220" height="80" class="config" />
  <text x="390" y="325">usb_whitelist.txt</text>
  <text x="390" y="350" style="font-size: 16px; fill: #fca5a5;">(Centralized Config)</text>
  <line x1="500" y1="330" x2="550" y2="330" />

  <rect x="550" y="300" width="180" height="60" class="agent" />
  <text x="640" y="340">Wazuh Agent</text>
  <line x1="730" y1="330" x2="780" y2="330" />

  <rect x="780" y="300" width="200" height="60" class="os" />
  <text x="880" y="340">Linux / Windows</text>
  <line x1="980" y1="330" x2="1030" y2="330" />

  <rect x="1030" y="300" width="220" height="60" class="action" />
  <text x="1140" y="340">Rules / Registry Policy</text>
  <line x1="1250" y1="330" x2="1300" y2="330" />

  <rect x="1300" y="300" width="200" height="60" class="action" />
  <text x="1400" y="340">Auto Reload/Apply</text>
  <line x1="1500" y1="330" x2="1550" y2="330" />

  <rect x="1550" y="300" width="240" height="60" class="final" />
  <text x="1670" y="340" style="font-weight: bold;">USB Allow / Block</text>
</svg>
